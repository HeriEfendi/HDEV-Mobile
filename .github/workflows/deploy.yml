name: Deploy Web, Desktop & Android Apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ### JOB 1: Deploy website ke GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

  ### JOB 2: Kompilasi otomatis Tauri (.exe & .AppImage) dan Publish Release Resmi
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing version $VERSION to package.json, tauri.conf.json, and Cargo.toml..."
          npm version $VERSION --no-git-tag-version --allow-same-version || true
          npx json -I -f src-tauri/tauri.conf.json -e "this.version='$VERSION'" || true
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build Tauri app & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "App Release ${{ github.ref_name }}"
          releaseBody: "Rilis otomatis untuk versi ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  ### JOB 3: Build APK Android (Capacitor) & Attach ke Release
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag to Android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          echo "Syncing version $VERSION (Code: $VERSION_CODE) to Android build.gradle & package.json..."
          npm version $VERSION --no-git-tag-version --allow-same-version || true
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK File with Version Tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/hk-umkm-${VERSION}-debug.apk

      - name: Upload APK to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/hk-umkm-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}